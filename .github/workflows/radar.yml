name: Cards & Quest
 
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/projects.json"
      - "scripts/cards.py"
      - ".github/workflows/radar.yml"

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Self-hosted stat and repo cards + dynamic Current Quest updater.
      - name: Stat cards and current quest
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python scripts/cards.py \
            --user "${{ github.repository_owner }}" \
            --projects assets/projects.json \
            --readme README.md \
            --out assets

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/card-*.svg README.md
          git diff --staged --quiet || git commit -m "chore: refresh cards and current quest"
          git push
